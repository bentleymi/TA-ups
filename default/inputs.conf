[script://$SPLUNK_HOME/etc/apps/TA-ups/bin/ups_events.py]
interval = 120
index = main
sourcetype = ups:status
source = status
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-ups/bin/ups_metrics.py]
interval = 120
index = metrics
sourcetype = ups:metrics
source = metrics
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-ups/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-ups
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14
